<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MoMo Verification Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --yellow: #ffcc00;
      --black: #171717;
      --background: #f5f5f5;
      --green: #16803d;
      --red: #b42318;
    }

    body {
      margin: 0;
      padding: 18px;
      background: var(--background);
      color: var(--black);
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 430px;
      margin: 22px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.09);
    }

    header {
      margin: -24px -24px 22px;
      padding: 23px 18px;
      color: var(--black);
      background: var(--yellow);
      text-align: center;
      border-radius: 12px 12px 0 0;
    }

    .brand {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    h2 {
      font-size: 21px;
    }

    p {
      line-height: 1.5;
    }

    .notice {
      padding: 12px;
      margin-bottom: 18px;
      color: #594600;
      background: #fff5cc;
      border: 1px solid #ffe580;
      border-radius: 7px;
      font-size: 14px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #c9c9c9;
      border-radius: 7px;
      font-size: 17px;
      font-family: Arial, sans-serif;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid var(--yellow);
      border-color: var(--black);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: 0;
      border-radius: 7px;
      background: var(--yellow);
      color: var(--black);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary {
      background: var(--black);
      color: white;
    }

    .phone-input {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid #c9c9c9;
      border-radius: 7px;
      overflow: hidden;
    }

    .country-code {
      display: flex;
      align-items: center;
      align-self: stretch;
      padding: 0 10px;
      background: var(--yellow);
      color: var(--black);
      white-space: nowrap;
      font-weight: bold;
    }

    .phone-input input {
      min-width: 0;
      border: 0;
      border-radius: 0;
      outline: none;
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      width: 50px;
      height: 50px;
      margin: 25px auto;
      border: 5px solid #eee;
      border-top-color: var(--yellow);
      border-right-color: var(--black);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
